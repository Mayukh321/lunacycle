<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback</title>
    <link rel="stylesheet" href="./dashboard.css">
    <style>
        .feedback-container{

    padding:30px;
}
.feedback-btn{

    background:
    linear-gradient(
    to right,
    #AE2448,
    #e05a7a
    );

    color:white;

    border:none;

    padding:15px;

    border-radius:14px;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;
}

.feedback-btn:hover{

    opacity:0.9;
}

.success-box{

    margin-top:20px;

    color:green;

    font-weight:bold;
}

@media(max-width:768px){

    .feedback-container{

        padding:18px;
    }

    .feedback-card{

        padding:22px;
    }
}
    </style>
</head>
<body>

<div class="grid-container">

<main class="main-container">

<div class="feedback-container">

<div class="feedback-card">

<h1>
💬 Feedback Form
</h1>

<p>
Help us improve Luna Cycle
by sharing your experience.
</p>

<form
class="feedback-form"
id="feedbackForm">

<textarea
name="feedback"
placeholder="Write your feedback..."
required></textarea>

<button
class="feedback-btn"
type="submit">

Submit Feedback

</button>

</form>

<div
class="success-box"
id="successBox">
</div>

</div>

</div>

</main>

</div>

</body>
</html>
